<meta charset="utf-8">
<title>Wahy Studio screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a quiet working tool. Transcript (the reading surface) on the start side, the video beside it on the end
   side; a narrow rail for the app's places, and tabs for the open lecture. Colour is spent on meaning only:
   kind of quote (verse, hadith, dhikr), verdict, and the spoken-word marker. These tokens match web/src/shell/tokens.css. */
:root {
  --paper: #f2f4f1;      --surface: #ffffff;   --surface-2: #e9ece8;  --line: #d6dbd5;
  --ink: #17201e;        --ink-2: #4a5552;     --ink-3: #75817d;
  --accent: #0e5d58;     --accent-ink: #ffffff; --accent-soft: #d9eae6;
  --quran: #2a4d9b;      --quran-soft: #e3e9f7;
  --hadith: #96461c;     --hadith-soft: #f5e6dc;
  --dhikr: #6a3d88;      --dhikr-soft: #eee5f4;
  --ok: #217b4c;         --ok-soft: #dcefe3;
  --bad: #b3312e;        --bad-soft: #f7e0de;
  --unsure: #9c6c0e;     --unsure-soft: #f5ebd2;
  --none: #75817d;       --none-soft: #e9ece8;
  --now: #ffdf6e;        --now-ink: #17201e;
  --stage: #0c1110;      --stage-ink: #f3f5f4;
  --shadow: 0 1px 2px rgb(16 24 22 / .06), 0 6px 20px rgb(16 24 22 / .08);

  --font-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-read: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
  --font-quran: "Amiri", "Noto Naskh Arabic", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

  --text-xs: .75rem; --text-s: .8125rem; --text-m: .875rem; --text-l: 1rem; --text-xl: 1.25rem; --text-2xl: 1.625rem;
  --text-read: 1.3rem; --leading-read: 2.15;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --radius-s: 4px; --radius-m: 8px; --radius-l: 12px;
  --rail: 84px; --header: 56px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1312;      --surface: #161b1a;   --surface-2: #1e2423;  --line: #2b3331;
  --ink: #e4e9e7;        --ink-2: #aab5b1;     --ink-3: #7b8783;
  --accent: #52b8ad;     --accent-ink: #05201d; --accent-soft: #163330;
  --quran: #92b1f2;      --quran-soft: #1a2640;
  --hadith: #e8a073;     --hadith-soft: #372319;
  --dhikr: #c79de3;      --dhikr-soft: #2c2137;
  --ok: #5fc88d;         --ok-soft: #142e1f;
  --bad: #f17b75;        --bad-soft: #3a1918;
  --unsure: #e5b649;     --unsure-soft: #342811;
  --none: #7b8783;       --none-soft: #1e2423;
  --now: #e6c24a;        --now-ink: #121212;
  --stage: #070a09;      --stage-ink: #f3f5f4;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .45);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0f1312;      --surface: #161b1a;   --surface-2: #1e2423;  --line: #2b3331;
  --ink: #e4e9e7;        --ink-2: #aab5b1;     --ink-3: #7b8783;
  --accent: #52b8ad;     --accent-ink: #05201d; --accent-soft: #163330;
  --quran: #92b1f2;      --quran-soft: #1a2640;
  --hadith: #e8a073;     --hadith-soft: #372319;
  --dhikr: #c79de3;      --dhikr-soft: #2c2137;
  --ok: #5fc88d;         --ok-soft: #142e1f;
  --bad: #f17b75;        --bad-soft: #3a1918;
  --unsure: #e5b649;     --unsure-soft: #342811;
  --none: #7b8783;       --none-soft: #1e2423;
  --now: #e6c24a;        --now-ink: #121212;
  --stage: #070a09;      --stage-ink: #f3f5f4;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: var(--text-m); line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
h2 { font-size: var(--text-xl); }
h3 { font-size: var(--text-l); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.label { font-size: var(--text-xs); color: var(--ink-3); font-weight: 500; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-rows: var(--header) 1fr; min-height: 100%; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: var(--space-3);
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-quran); font-size: 1.35rem; font-weight: 700; white-space: nowrap; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 1rem; line-height: 1; }
.crumb { display: flex; align-items: center; gap: var(--space-2); min-width: 0; color: var(--ink-2); }
.crumb b { color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; min-width: 34px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--surface); color: var(--ink-2); }
.iconbtn:hover { color: var(--ink); background: var(--surface-2); }
[dir="rtl"] .flip { transform: scaleX(-1); }
.iconbtn svg, .rail svg, .btn svg { width: 18px; height: 18px; flex: none; }
.jobpill { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: var(--text-s); white-space: nowrap; }
.jobpill i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.frame { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 0; }
.rail { background: var(--surface); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: var(--space-3) var(--space-2); }
.rail a { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: var(--radius-m); color: var(--ink-2); text-decoration: none; font-size: var(--text-xs); text-align: center; line-height: 1.3; }
.rail a:hover { background: var(--surface-2); color: var(--ink); }
.rail a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rail .badge { position: absolute; top: 4px; inset-inline-start: 50%; margin-inline-start: 8px; }
.rail .sep { height: 1px; background: var(--line); margin: var(--space-2) 6px; }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--ink); color: var(--surface); font: 500 10.5px/1 var(--font-mono); }
main { min-width: 0; padding-block: var(--space-5) var(--space-7); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-4); }

/* lecture tabs */
.lechead { display: flex; flex-wrap: wrap; align-items: end; gap: var(--space-3) var(--space-5); border-bottom: 1px solid var(--line); }
.lechead h1 { font-size: var(--text-xl); padding-bottom: var(--space-3); }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tabs a { display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="true"] { color: var(--ink); border-color: var(--accent); font-weight: 600; }
.tabs .badge { background: var(--surface-2); color: var(--ink-2); }
.tabs a[aria-current="true"] .badge { background: var(--accent); color: var(--accent-ink); }
.version { margin-inline-start: auto; padding-bottom: var(--space-2); display: flex; align-items: center; gap: var(--space-2); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--radius-m); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.small { height: 30px; padding: 0 10px; font-size: var(--text-s); }
.btn.danger { color: var(--bad); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-m); background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; color: var(--ink-2); font-size: var(--text-s); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.input, select.input, textarea.input { height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--surface); width: 100%; min-width: 0; }
textarea.input { height: auto; padding: 10px; line-height: 1.8; resize: vertical; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: var(--text-s); color: var(--ink-2); white-space: nowrap; }
.switch input { appearance: none; width: 32px; height: 18px; border-radius: 99px; background: var(--line); position: relative; margin: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: inset-inline-start .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { inset-inline-start: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: var(--text-s); white-space: nowrap; }
.chip[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: currentColor; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); }
.panel-h { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-b { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-3); }

/* verdict chip */
.vchip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: var(--text-xs); font-weight: 600; white-space: nowrap; font-family: var(--font-ui); }
.vchip.ok { background: var(--ok-soft); color: var(--ok); }
.vchip.bad { background: var(--bad-soft); color: var(--bad); }
.vchip.unsure { background: var(--unsure-soft); color: var(--unsure); }
.vchip.none { background: var(--none-soft); color: var(--none); }
.vchip.busy { background: var(--accent-soft); color: var(--accent); }
.kchip { font-size: var(--text-xs); font-weight: 600; padding: 1px 8px; border-radius: var(--radius-s); }
.kchip.quran { color: var(--quran); background: var(--quran-soft); }
.kchip.hadith { color: var(--hadith); background: var(--hadith-soft); }
.kchip.dhikr { color: var(--dhikr); background: var(--dhikr-soft); }

/* ---------- lecture view ---------- */
.kpis { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); color: var(--ink-2); font-size: var(--text-s); }
.kpis span { display: inline-flex; gap: 5px; align-items: baseline; }
.kpis b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
.toolbar .search { width: 180px; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); gap: var(--space-4); align-items: start; }
.stage[data-layout="text"] { grid-template-columns: minmax(0, 1fr); }
.stage[data-layout="text"] .player { display: none; }
.stage[data-layout="video"] { grid-template-columns: minmax(0, 960px); justify-content: center; }
.stage[data-layout="video"] .reader { display: none; }
.reader { position: relative; }
.reader .panel-b { max-height: calc(100vh - 290px); min-height: 420px; overflow-y: auto; }
.progressline { height: 3px; background: var(--surface-2); }
.progressline i { display: block; height: 100%; width: 0; background: var(--accent); }
.transcript { font-family: var(--font-read); font-size: var(--text-read); line-height: var(--leading-read); max-width: 46em; }
.transcript p { margin: 0 0 1.1em; }
.w { border-radius: 3px; padding: 0 1px; cursor: pointer; transition: background .12s; }
.w:hover { background: var(--surface-2); }
.w.past { color: var(--ink); }
.w.future { color: var(--ink-2); }
.w.now { background: var(--now); color: var(--now-ink); box-shadow: 0 0 0 2px var(--now); }
.w.hit { outline: 2px solid var(--accent); outline-offset: 1px; }
.f { border-radius: 4px; padding: 3px 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.f.quran { background: var(--quran-soft); }
.f.quran .w { font-family: var(--font-quran); font-size: 1.08em; }
.f.hadith { background: var(--hadith-soft); }
.f.dhikr { background: var(--dhikr-soft); }
.f .br { font-family: var(--font-quran); }
.f.quran .br { color: var(--quran); }
.f.hadith .br { color: var(--hadith); }
.f.dhikr .br { color: var(--dhikr); }
.ref { font-family: var(--font-ui); font-size: .62em; font-weight: 600; padding: 1px 6px; margin-inline-start: 4px; border-radius: var(--radius-s); vertical-align: .15em; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; line-height: 1.6; }
.f.quran .ref { color: var(--quran); }
.f.hadith .ref { color: var(--hadith); }
.f.dhikr .ref { color: var(--dhikr); }
.ref .vd { width: 7px; height: 7px; border-radius: 50%; }
.vd.ok { background: var(--ok); } .vd.bad { background: var(--bad); } .vd.unsure { background: var(--unsure); } .vd.none { background: transparent; box-shadow: inset 0 0 0 1.5px var(--none); }
.f.bad { background: repeating-linear-gradient(-45deg, transparent 0 6px, var(--bad-soft) 6px 8px); }
.f.sel { box-shadow: 0 0 0 2px var(--accent); }

.player { position: sticky; top: calc(var(--header) + var(--space-4)); display: flex; flex-direction: column; gap: var(--space-3); }
.video { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--radius-l); overflow: hidden; background:
  radial-gradient(120% 90% at 70% 30%, #2a3634 0%, var(--stage) 70%); color: var(--stage-ink); }
.video .speaker { position: absolute; inset: 18% 34% 0; border-radius: 50% 50% 0 0 / 38% 38% 0 0; background: linear-gradient(#3a4745, #1b2322); opacity: .8; }
.video .speaker::before { content: ""; position: absolute; width: 38%; aspect-ratio: 1; border-radius: 50%; top: -22%; left: 31%; background: #46524f; }
.video .cap { position: absolute; inset: auto 6% 8% 6%; text-align: center; font-family: var(--font-read); font-size: clamp(.85rem, 1.6vw, 1.08rem); line-height: 1.7; background: rgb(0 0 0 / .68); padding: 4px 10px; border-radius: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.video .cap:empty { display: none; }
.video .stamp { position: absolute; top: 10px; inset-inline-end: 10px; font: 500 11px var(--font-mono); background: rgb(0 0 0 / .5); padding: 2px 6px; border-radius: 4px; }
.controls { display: flex; align-items: center; gap: var(--space-2); }
.controls input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.time { font: 500 var(--text-s) var(--font-mono); color: var(--ink-2); white-space: nowrap; direction: ltr; }
.nowcard { padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 6px; }
.nowcard .quote { font-family: var(--font-read); font-size: 1.02rem; line-height: 1.9; }

.pop { position: absolute; z-index: 4; width: 300px; max-width: calc(100% - 24px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); box-shadow: var(--shadow); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.pop .x { position: absolute; top: 8px; inset-inline-end: 8px; }
.pop .quote { font-family: var(--font-read); font-size: 1rem; line-height: 1.9; max-height: 6.5em; overflow: hidden; }

/* ---------- editor ---------- */
.edgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: var(--space-4); align-items: start; }
.board { font-family: var(--font-read); font-size: 1.12rem; line-height: 2.5; }
.board .bw { display: inline-block; padding: 0 6px; margin: 2px 1px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; line-height: 1.9; }
.board .bw:hover { border-color: var(--line); background: var(--surface-2); }
.board .bw.quran { background: var(--quran-soft); color: var(--quran); }
.board .bw.hadith { background: var(--hadith-soft); color: var(--hadith); }
.board .bw.dhikr { background: var(--dhikr-soft); color: var(--dhikr); }
.board .bw.fsel { border-color: currentColor; }
.board .bw.rsel { background: var(--accent); color: var(--accent-ink); }
.board .bw.anchor { box-shadow: 0 0 0 2px var(--accent); }
.board .brk { display: block; height: var(--space-3); }
.inspector { position: sticky; top: calc(var(--header) + var(--space-4)); }
.inspector .quote { font-family: var(--font-read); font-size: 1.02rem; line-height: 1.95; background: var(--surface-2); padding: var(--space-3); border-radius: var(--radius-m); max-height: 9em; overflow-y: auto; }
.cands { display: flex; flex-direction: column; gap: 6px; }
.cand { display: flex; align-items: center; gap: var(--space-2); padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-m); cursor: pointer; }
.cand:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.cand input { accent-color: var(--accent); margin: 0; }
.cand .t { font-family: var(--font-read); font-size: .95rem; color: var(--ink-2); }
.tokens { display: flex; flex-wrap: wrap; gap: 4px; font-family: var(--font-read); }
.tokens span { padding: 1px 8px; border-radius: 99px; border: 1px dashed var(--line); font-size: .95rem; }
.tokens span.diff { border-style: solid; border-color: var(--unsure); color: var(--unsure); }
.miniplayer { display: flex; align-items: center; gap: var(--space-2); padding: 6px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); flex-wrap: wrap; }
.seltool { display: flex; align-items: center; gap: var(--space-2); padding: 6px; background: var(--ink); color: var(--surface); border-radius: var(--radius-m); box-shadow: var(--shadow); flex-wrap: wrap; }
.seltool .btn { background: transparent; color: var(--surface); border-color: transparent; }
.seltool .btn:hover { background: rgb(255 255 255 / .12); }
.results { display: flex; flex-direction: column; gap: 6px; }
.result { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-2); align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-m); }
.result .t { font-family: var(--font-read); font-size: .98rem; min-width: 0; }

table.data { width: 100%; border-collapse: collapse; font-size: var(--text-s); }
table.data th { text-align: start; font-weight: 500; color: var(--ink-3); font-size: var(--text-xs); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }

  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action[0])}</button>` : ""}`;
  if (action) el.querySelector("button").onclick = () => { action[1](); el.remove(); };
  $("#toasts").append(el); setTimeout(() => el.remove(), 4200);
}

function renderTranscript() {
  const el = $("#transcript"); if (!el) return;
  const fm = findingOf(); const q = norm(S.q);
  let html = "", para = 0, i = 0;
  html += "<p>";
  while (i < W.length) {
    if (W[i][3] !== para) { para = W[i][3]; html += "</p><p>"; }
    const fi = fm[i];
    if (fi >= 0 && shown(F[fi]) && F[fi].s === i) {
      const f = F[fi]; const [o, c] = BR[f.type];
      html += `<span class="f ${f.type} ${f.verdict === "bad" ? "bad" : ""} ${S.pop === fi ? "sel" : ""}" data-f="${fi}"><span class="br">${o}</span>`;
      for (let k = f.s; k < f.e; k++) html += `<span class="w" data-i="${k}">${esc(wtext(k, true))}</span> `;
      html = html.trimEnd() + `<span class="br">${c}</span><span class="ref" data-ref="${fi}" style="background:var(--surface)"><span class="vd ${f.verdict}"></span>${esc(f.ref)}${f.amb ? " ·؟" : ""}</span></span> `;
      i = f.e; continue;
    }
    const hit = q && norm(W[i][0]).includes(q);
    html += `<span class="w${hit ? " hit" : ""}" data-i="${i}">${esc(W[i][0])}</span> `;
    i++;
  }
  el.innerHTML = html + "</p>";
  if (S.pop != null) showPop(S.pop, true);
  syncTime();
}

function syncTime() {
  const cur = wordAt(S.t);
  document.querySelectorAll("#transcript .w").forEach((w) => {
    const i = +w.dataset.i; w.classList.toggle("now", i === cur && S.t > 0); w.classList.toggle("future", i > cur);
  });
  const p = $("#readProg"); if (p) p.style.width = `${(S.t / DUR) * 100}%`;
  const tl = $("#timeLbl"); if (tl) tl.textContent = `${mmss(S.t)} / ${mmss(DUR)}`;
  const sk = $("#seek"); if (sk && document.activeElement !== sk) sk.value = S.t;
  const capEl = $("#cap");
  if (capEl) { const c = CAP.find((c) => S.t >= c[0] && S.t <= c[1] + .3); capEl.textContent = c ? (S.script === "spoken" ? strip(c[2]) : c[2]) : ""; }
  const nc = $("#nowcard");
  if (nc) {
    const fi = findingOf()[cur]; const f = F[fi];
    nc.innerHTML = f ? `<div class="row"><span class="kchip ${f.type}">${KIND_AR[f.type]}</span><b>${esc(f.ref)}</b><span class="grow"></span>${vchip(f.verdict)}</div><div class="quote">${esc(fText(f, S.script === "standard"))}</div>`
      : `<span class="label">الآن</span><span class="muted">${cur >= 0 ? "كلام المتحدث، لا اقتباس هنا." : "اضغط تشغيل، أو انقر أي كلمة للانتقال إليها."}</span>`;
  }
  if (S.follow && S.playing) { const n = $("#transcript .w.now"); if (n) n.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  const pb = $("#playBtn"); if (pb) pb.textContent = S.playing ? "إيقاف مؤقت" : "تشغيل";
}

let timer = null;
function play(on) {
  S.playing = on; clearInterval(timer);
  if (on) timer = setInterval(() => {
    S.t += 0.1; if (S.stopAt != null && S.t >= S.stopAt) { S.stopAt = null; play(false); }
    if (S.t >= DUR) { S.t = DUR; play(false); }
    syncTime();
  }, 100);
  syncTime();
}

function showPop(fi, keep) {
  const old = $("#pop"); if (old) old.remove();
  const f = F[fi]; const anchor = document.querySelector(`[data-ref="${fi}"]`) || document.querySelector(`[data-f="${fi}"]`);
  if (!f || !anchor) return;
  S.pop = fi;
  const reader = $(".reader"); const r = anchor.getBoundingClientRect(), rr = reader.getBoundingClientRect();
  const pop = document.createElement("div"); pop.className = "pop"; pop.id = "pop";
  pop.innerHTML = `<button class="iconbtn x" id="popX" title="إغلاق">✕</button>
    <div class="row"><span class="kchip ${f.type}">${KIND_AR[f.type]}</span><b>${esc(f.ref)}</b></div>
    <div class="row">${vchip(f.verdict)}${f.boundary ? `<span class="faint" style="font-size:var(--text-xs)">${BOUND[f.boundary]}</span>` : ""}${f.by ? `<span class="faint mono" style="font-size:11px">${f.by} · ${Math.round(f.conf * 100)}٪</span>` : ""}</div>
    ${f.amb ? `<div class="muted" style="font-size:var(--text-s)">مرجع غير محسوم: ${f.cands.length} مواضع محتملة (${f.cands.slice(1).map(esc).join("، ")}).</div>` : ""}
    <div class="quote">${esc(fText(f, true))}</div>
    <div class="row"><button class="btn small primary" id="popPlay">تشغيل الاقتباس</button><a class="btn small" href="#edit" id="popEdit">تحرير</a><a class="btn small ghost" href="#verify">تحقق</a></div>`;
  reader.append(pop);
  let top = r.bottom - rr.top + 8; if (top + 280 > reader.clientHeight) top = Math.max(8, r.top - rr.top - 290);
  pop.style.top = `${top}px`;
  const rtl = document.documentElement.dir !== "ltr";
  const x = rtl ? Math.min(rr.right - r.right, rr.width - 316) : Math.min(r.left - rr.left, rr.width - 316);
  pop.style[rtl ? "right" : "left"] = `${Math.max(12, x)}px`;
  $("#popX").onclick = () => { S.pop = null; pop.remove(); renderTranscript(); };
  $("#popPlay").onclick = () => { S.t = W[f.s][1]; S.stopAt = W[f.e - 1][2]; play(true); };
  $("#popEdit").onclick = () => { S.edFinding = f.id; S.range = null; };
  if (!keep) document.querySelectorAll(".f.sel").forEach((e) => e.classList.remove("sel")), anchor.closest(".f")?.classList.add("sel");
}

function bindView() {
  document.querySelectorAll("[data-layout]").forEach((b) => b.onclick = () => { S.layout = b.dataset.layout; route(); });
  document.querySelectorAll("[data-kind]").forEach((b) => b.onclick = () => { S.kind = b.dataset.kind; S.pop = null; route(); });
  document.querySelectorAll("[data-verdict]").forEach((b) => b.onclick = () => { S.show[b.dataset.verdict] = !S.show[b.dataset.verdict]; S.pop = null; route(); });
  $("#clipBtn").onclick = () => { S.clipped = !S.clipped; S.pop = null; route(); };
  $("#scriptSw").onchange = (e) => { S.script = e.target.checked ? "standard" : "spoken"; renderTranscript(); };
  $("#followSw").onchange = (e) => { S.follow = e.target.checked; };
  $("#searchIn").oninput = (e) => { S.q = e.target.value; renderTranscript(); };
  $("#playBtn").onclick = () => play(!S.playing);
  $("#back5").onclick = () => { S.t = Math.max(0, S.t - 5); syncTime(); };
  $("#fwd5").onclick = () => { S.t = Math.min(DUR, S.t + 5); syncTime(); };
  $("#seek").oninput = (e) => { S.t = +e.target.value; syncTime(); };
  $("#transcript").onclick = (e) => {
    const ref = e.target.closest("[data-ref]");
    if (ref) { showPop(+ref.dataset.ref); return; }
    const w = e.target.closest(".w"); if (!w) return;
    S.t = W[+w.dataset.i][1] + 0.001; S.stopAt = null; syncTime();
    const f = w.closest(".f"); if (f) showPop(+f.dataset.f); else { S.pop = null; $("#pop")?.remove(); document.querySelectorAll(".f.sel").forEach((e) => e.classList.remove("sel")); }
  };
  renderTranscript();
}

      <textarea class="input" rows="16" style="font-family:var(--font-read);font-size:1.1rem">${esc(paraText())}</textarea></div></section>`;

      <div class="scroll-x"><table class="data"><thead><tr><th>#</th><th>البداية</th><th>النهاية</th><th>النص</th><th></th></tr></thead><tbody>
      ${CAP.slice(0, 12).map((c, i) => `<tr><td class="mono faint">${i + 1}</td><td><input class="input mono" style="width:96px;height:30px" value="${c[0].toFixed(2)}"></td><td><input class="input mono" style="width:96px;height:30px" value="${c[1].toFixed(2)}"></td><td class="ar">${esc(c[2])}</td><td style="white-space:nowrap"><button class="btn small ghost">−0.1</button><button class="btn small ghost">+0.1</button><button class="btn small ghost">من المشغل</button></td></tr>`).join("")}

    ${body}`;
};
const paraText = () => { let out = "", p = 0; W.forEach((w) => { if (w[3] !== p) { out = out.trimEnd() + "\n\n"; p = w[3]; } out += w[0] + " "; }); return out.trim(); };

function renderBoard() {
  const b = $("#board"); if (!b) return;
  const fm = findingOf(); const sel = F.find((f) => f.id === S.edFinding);
  let html = "", p = 0;
  W.forEach((w, i) => {
    if (w[3] !== p) { html += `<span class="brk"></span>`; p = w[3]; }
    const fi = fm[i]; const f = F[fi];
    const inR = S.range && i >= S.range[0] && i <= S.range[1];
    const cls = ["bw", f ? f.type : "", f && sel && f.id === sel.id && !S.range ? "fsel" : "", inR ? "rsel" : "", S.anchor === i ? "anchor" : ""].join(" ");
    html += `<span class="${cls}" data-i="${i}">${esc(strip(w[0]))}</span>`;
  });
  b.innerHTML = html;
  $("#seltool").innerHTML = S.anchor != null && !S.range ? `<div class="muted" style="font-size:var(--text-s)">بداية التحديد: «${esc(strip(W[S.anchor][0]))}». انقر الكلمة الأخيرة.</div>`
    : S.range ? `<div class="seltool"><span style="padding:0 8px;font-size:var(--text-s)">${S.range[1] - S.range[0] + 1} كلمات محددة</span><button class="btn small" data-act="missed">إضافة اقتباس فائت</button><button class="btn small">تعديل الكلمات</button><button class="btn small">حفظ كذكر</button><button class="btn small" data-act="clear">إلغاء</button></div>` : "";
  renderInspector();
}

function renderInspector() {
  const el = $("#inspector"); if (!el) return;
  if (S.range) {
    const words = W.slice(S.range[0], S.range[1] + 1).map((w) => strip(w[0])).join(" ");
    const isDhikr = norm(words).includes(norm("لا إله إلا الله"));
    const res = isDhikr ? [["dhikr", "لا إله إلا الله", "الأذكار · التهليل"], ["quran", "فَاعْلَمْ أَنَّهُ لَا إِلَٰهَ إِلَّا اللَّهُ", "محمد: 19"], ["quran", "إِنَّهُمْ كَانُوا إِذَا قِيلَ لَهُمْ لَا إِلَٰهَ إِلَّا اللَّهُ يَسْتَكْبِرُونَ", "الصافات: 35"]]
      : [["quran", "…أقرب آية في المصدر…", "نتيجة بحث"], ["hadith", "…أقرب حديث…", "نتيجة بحث"]];
    el.innerHTML = `<section class="panel"><div class="panel-h"><h3>اقتباس فائت</h3></div><div class="panel-b">
      <div class="quote">${esc(words)}</div>
      <div class="field"><span class="label">النوع</span><div class="seg"><button aria-pressed="${isDhikr}">ذكر</button><button aria-pressed="${!isDhikr}">آية</button><button aria-pressed="false">حديث</button></div></div>
      <div class="field"><span class="label">البحث في المصادر</span><input class="input" value="${esc(words)}"></div>
      <div class="results">${res.map(([k, t, r], i) => `<label class="result"><input type="radio" name="res" ${i === 0 ? "checked" : ""} style="accent-color:var(--accent);margin:0"><span class="t">${esc(t)}</span><span class="kchip ${k}">${esc(r)}</span></label>`).join("")}</div>
      <label class="switch"><input type="checkbox">اقتباس من خارج المصادر</label>
      <div class="row"><button class="btn primary" id="insertMissed" data-kind="${isDhikr ? "dhikr" : "quran"}" data-ref="${isDhikr ? "التهليل" : res[0][2]}">إدراج الاقتباس</button><button class="btn ghost" data-act="clear">إلغاء</button></div>
    </div></section>`;
    $("#insertMissed").onclick = (e) => insertMissed(e.target.dataset.kind, e.target.dataset.ref);
    el.querySelectorAll("[data-act=clear]").forEach((b) => b.onclick = clearSel);
    return;
  }
  const idx = F.findIndex((f) => f.id === S.edFinding); const f = F[idx] || F[0];
  const spoken = W.slice(f.s, f.e).map((w) => strip(w[0])); const canon = W.slice(f.s, f.e).map((w) => w[0]);
  el.innerHTML = `<section class="panel"><div class="panel-h">
      <button class="iconbtn" id="prevF" title="السابق">→</button><span class="mono faint">${idx + 1} / ${F.length}</span><button class="iconbtn" id="nextF" title="التالي">←</button>
      <span class="grow"></span><span class="kchip ${f.type}">${KIND_AR[f.type]}</span><b>${esc(f.ref)}</b></div>
    <div class="panel-b">
      <div class="row">${vchip(f.verdict)}${f.boundary ? `<span class="faint" style="font-size:var(--text-xs)">${BOUND[f.boundary]}</span>` : ""}<span class="grow"></span><span class="faint mono" style="font-size:11px">${f.band}</span></div>
      <div class="field"><span class="label">كما قيل</span><div class="quote">${esc(spoken.join(" "))}</div></div>
      <div class="field"><span class="label">المراجع المطابقة ${f.cands.length > 1 ? `(${f.cands.length})` : ""}</span><div class="cands">
        ${f.cands.map((c, i) => `<label class="cand"><input type="radio" name="cand" ${i === 0 ? "checked" : ""}><b style="font-size:var(--text-s)">${esc(c)}</b><span class="grow"></span>${i === 0 ? `<span class="faint" style="font-size:var(--text-xs)">المعتمد</span>` : ""}</label>`).join("")}
        <button class="btn small ghost" style="align-self:start">+ إضافة مرجع من البحث</button></div></div>
      <div class="field"><span class="label">كلمات المصدر (انقر لتطبيقها على النص)</span><div class="tokens">${canon.slice(0, 14).map((w, i) => `<span class="${w !== spoken[i] ? "diff" : ""}">${esc(w)}</span>`).join("")}${canon.length > 14 ? "<span>…</span>" : ""}</div></div>
      <div class="grid2" style="grid-template-columns:1fr 1fr">
        <div class="field"><span class="label">البداية</span><div class="row" style="gap:4px"><button class="btn small">− كلمة</button><button class="btn small">+ كلمة</button></div></div>
        <div class="field"><span class="label">النهاية</span><div class="row" style="gap:4px"><button class="btn small">− كلمة</button><button class="btn small">+ كلمة</button></div></div>
      </div>
      <div class="field"><span class="label">حكمك</span><div class="seg" id="humanV">${["ok", "unsure", "bad"].map((v) => `<button data-hv="${v}" aria-pressed="${f.human === v}">${VERD[v]}</button>`).join("")}</div></div>
      <label class="switch"><input type="checkbox" id="refWrong" ${f.refWrong ? "checked" : ""}>المرجع خاطئ أو ناقص</label>
      <div class="row"><button class="btn small">تغيير النوع</button><button class="btn small">تحقق من هذا الاقتباس</button><span class="grow"></span><button class="btn small danger" id="delF">حذف…</button></div>
    </div></section>`;
  $("#prevF").onclick = () => { S.edFinding = F[(idx - 1 + F.length) % F.length].id; renderBoard(); };
  $("#nextF").onclick = () => { S.edFinding = F[(idx + 1) % F.length].id; renderBoard(); };

  $("#main").innerHTML = `<div class="screen">${SCREENS[k]()}</div>`;

};
