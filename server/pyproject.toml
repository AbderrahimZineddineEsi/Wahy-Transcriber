[project]
name = "wahy-server"
version = "0.1.0"
description = "Wahy-Finder server (rewrite, ADR 0001)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
local-asr = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.6",       # 12.6 is what torch cu126 (the laya extra) needs; ctranslate2 runs on it
    "nvidia-cudnn-cu12>=9,<10",
]
# local Laya (core/ai/laya_local.py): `uv sync --extra laya`. torch comes from PyTorch's CUDA 12.6 index, the
# newest build that still has kernels for the GTX 1050 (sm_61); PyPI's CUDA 13 builds dropped it.
laya = [
    "laya>=0.4.12",
    "torch>=2.14",
    "huggingface-hub>=0.20",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wahy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs the network or a real model; only runs with --live"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# test files carry long Arabic strings and one-line asserts: line length is not enforced there
"tests/*" = ["E501"]
# ported from backend/tafrigh/ (phase 18) and kept as it was, so its tested behaviour is not disturbed by a style
# pass: long Arabic prompt lines, lambdas called in the loop that defines them (B023), a probed optional import
"wahy/features/tafrigh/*" = ["E501", "B023", "F401"]
# generated by `alembic revision --autogenerate`: kept as Alembic writes it
"migrations/versions/*" = ["E501", "UP", "I"]
