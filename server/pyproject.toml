[project]
name = "tadqeeq-server"
version = "0.1.0"
description = "Tadqeeq server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
local-asr = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.6",       # 12.6 is what torch cu126 (the laya extra) needs; ctranslate2 runs on it
    "nvidia-cudnn-cu12>=9,<10",
]
# local Laya (core/ai/laya_local.py): `uv sync --extra laya`. torch comes from PyTorch's CUDA 12.6 index, the
# newest build that still has kernels for the GTX 1050 (sm_61); PyPI's CUDA 13 builds dropped it.
laya = [
    "laya>=0.4.12",
    "torch>=2.14",
    "huggingface-hub>=0.20",
]

# the research side (wahy/laya, notebooks/data): tables, progress bars and the Jupyter kernel the notebooks run in.
# `uv sync --extra local-asr --extra laya --extra research`
research = [
    "beautifulsoup4>=4.12",   # sources/binbaz.py reads Bin Baz's lesson pages
    "pandas>=2.2",
    "tqdm>=4.66",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "matplotlib>=3.9",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
# beautifulsoup4, pandas, tqdm: the wahy/laya tests import the research modules
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "beautifulsoup4>=4.12", "pandas>=2.2", "tqdm>=4.66"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wahy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs the network or a real model; only runs with --live"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# test files carry long Arabic strings and one-line asserts: line length is not enforced there
"tests/*" = ["E501"]
# ported from backend/tafrigh/ (phase 18) and kept as it was, so its tested behaviour is not disturbed by a style
# pass: long Arabic prompt lines, lambdas called in the loop that defines them (B023), a probed optional import
"wahy/features/tafrigh/*" = ["E501", "B023", "F401"]
# moved from backend/laya_datagen/ (phase 22) and kept as it was, apart from the parts that now use core/ai, core/engine
# and features/transcription; the research notebooks read these modules' names, so no style pass renames or drops any
"wahy/laya/*" = ["E501", "UP006", "UP035", "UP045", "UP031", "UP037", "B905", "B007", "B023", "B904", "E741", "E702",
                 "E731", "E401", "F401", "F841", "I001"]
# generated by `alembic revision --autogenerate`: kept as Alembic writes it
"migrations/versions/*" = ["E501", "UP", "I"]
